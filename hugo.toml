baseURL = 'https://wuflyh.github.io/reading-notes/'
locale = 'en-us'
title = "AI Paper Reading Notes"
theme = "PaperMod"

# Enable JSON output for the search index (Fuse.js)
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Tags & categories are Hugo defaults, listed here explicitly for clarity
[taxonomies]
  tag = "tags"
  category = "categories"

# Menu — appears in the site header
[menu]
  [[menu.main]]
    identifier = "by-paper-date"
    name = "By Paper Date"
    url = "/by-paper-date/"
    weight = 10
  [[menu.main]]
    identifier = "categories"
    name = "Categories"
    url = "/categories/"
    weight = 15
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 30
  [[menu.main]]
    identifier = "contact"
    name = "Contact"
    url = "/contact/"
    weight = 40

# PaperMod theme parameters
[params]
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowRelated = true

  [params.footer]
    text = "Read and written with an LLM as a thinking partner."

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[markup]
  [markup.highlight]
    style = "monokai"         # try: dracula, nord, github, solarized-dark, vs, catppuccin-mocha
    lineNos = false           # set true for line numbers
    lineNumbersInTable = true
    noClasses = true          # inline styles (easier) — set false if you want to use custom CSS
    tabWidth = 4
  [markup.goldmark]
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)'], ['$', '$']]

# Related-posts scoring: show "You might also like..." at the bottom of each post
[related]
  threshold = 60
  includeNewer = true
  toLower = true

  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
